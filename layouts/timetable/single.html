{{ define "main" }}
  {{ $fixedHero := partial "uses-fixed-page-hero.html" . }}
  <article class="max-w-full">
    {{ if $fixedHero }}
      {{ partial "page-hero.html" (dict "title" .Title "id" "page-title" "class" "site-fixed-hero") }}
      <div class="site-page-body"><div class="site-page-width"><div class="site-page-content site-fixed-content">
    {{ else }}
      <header>
        <h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">
          {{ .Title | emojify }}
        </h1>
      </header>
    {{ end }}
    <section class="max-w-full mt-6 prose dark:prose-invert">
      {{ .Content }}
    </section>
    {{ if $fixedHero }}</div></div></div>{{ end }}
  </article>
{{ end }}
